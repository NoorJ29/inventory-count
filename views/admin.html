<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Inventory Admin</title>
<link rel="stylesheet" href="/css/style.css" />

<div class="admin-wrap">
  <h1>Physical Inventory Count - Admin</h1>

  <div class="admin-toolbar">
    <div class="dropdown">
      <button type="button" class="btn btn-primary dropdown-toggle" data-dropdown-toggle="exportMenu">
        Export / Clear
        <svg class="dropdown-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
      </button>
      <div class="dropdown-menu" id="exportMenu">
        <button id="btnExport" class="dropdown-item">Export to Excel</button>
        <button id="btnReset" class="dropdown-item dropdown-item--danger">Export &amp; Reset</button>
      </div>
    </div>

    <div class="dropdown">
      <button type="button" class="btn btn-secondary dropdown-toggle" data-dropdown-toggle="itemListMenu">
        Item List
        <svg class="dropdown-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
      </button>
      <div class="dropdown-menu" id="itemListMenu">
        <label class="dropdown-item" style="cursor:pointer;">
          Upload Item List
          <input id="fileUpload" type="file" accept=".xlsx" style="display:none;" />
        </label>
        <button id="btnClearItems" class="dropdown-item dropdown-item--danger">Remove Item List</button>
      </div>
    </div>

    <button id="btnRefresh" class="btn btn-secondary">Refresh</button>
    <button id="btnEditMode" type="button" class="btn btn-secondary">Edit Mode</button>
  </div>

  <div id="uploadStatus" class="error hidden"></div>

  <div id="itemMetaNotice" class="item-meta-notice"></div>

  <div id="summaryBar" class="summary-bar"></div>

  <div class="table-scroll">
    <table class="counts-table">
      <thead>
        <tr class="totals-row">
          <td colspan="10" class="totals-label">
            <span class="totals-label-inner">
              <button id="btnCopyTable" type="button" class="icon-btn icon-btn-sm" aria-label="Copy table" title="Copy table"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button>
              Total:
            </span>
          </td>
          <td id="totalDifferenceCell"></td>
          <td id="totalDifferenceCostCell"></td>
          <td class="actions-col"></td>
        </tr>
        <tr>
          <th><div class="th-inner"><span class="th-label">Date</span><button type="button" class="column-filter-btn" data-column="date" aria-label="Sort and filter Date"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg></button></div></th>
          <th><div class="th-inner"><span class="th-label">Name</span><button type="button" class="column-filter-btn" data-column="person" aria-label="Sort and filter Name"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg></button></div></th>
          <th><div class="th-inner"><span class="th-label">Location</span><button type="button" class="column-filter-btn" data-column="location" aria-label="Sort and filter Location"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg></button></div></th>
          <th><div class="th-inner"><span class="th-label">Item Code</span><button type="button" class="column-filter-btn" data-column="itemCode" aria-label="Sort and filter Item Code"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg></button></div></th>
          <th><div class="th-inner"><span class="th-label">Description</span><button type="button" class="column-filter-btn" data-column="description" aria-label="Sort and filter Description"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg></button></div></th>
          <th><div class="th-inner"><span class="th-label">UOM</span><button type="button" class="column-filter-btn" data-column="uom" aria-label="Sort and filter UOM"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg></button></div></th>
          <th><div class="th-inner"><span class="th-label">Unit Cost</span><button type="button" class="column-filter-btn" data-column="unitCost" aria-label="Sort and filter Unit Cost"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg></button></div></th>
          <th><div class="th-inner"><span class="th-label">Quantity</span><button type="button" class="column-filter-btn" data-column="quantity" aria-label="Sort and filter Quantity"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg></button></div></th>
          <th><div class="th-inner"><span class="th-label">Expiry Date</span><button type="button" class="column-filter-btn" data-column="expiryDate" aria-label="Sort and filter Expiry Date"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg></button></div></th>
          <th><div class="th-inner"><span class="th-label">System Inventory</span><button type="button" class="column-filter-btn" data-column="theoreticalInventory" aria-label="Sort and filter System Inventory"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg></button></div></th>
          <th><div class="th-inner"><span class="th-label">Difference</span><button type="button" class="column-filter-btn" data-column="difference" aria-label="Sort and filter Difference"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg></button></div></th>
          <th><div class="th-inner"><span class="th-label">Difference Cost</span><button type="button" class="column-filter-btn" data-column="differenceCost" aria-label="Sort and filter Difference Cost"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg></button></div></th>
          <th class="actions-col"><span class="th-label">Actions</span></th>
        </tr>
      </thead>
      <tbody id="countsBody"></tbody>
    </table>
  </div>
</div>

<script src="/js/dialog.js"></script>
<script src="/js/admin.js"></script>
